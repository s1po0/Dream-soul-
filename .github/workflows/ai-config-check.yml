name: AI configuration diagnosis
on:
  push:
    branches: [arena/15a781b8-dream-soul]
    paths: ['.github/workflows/ai-config-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check key family without reading credentials
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://cbkddsztcivllpwzflkx.supabase.co/functions/v1/ai-config-check', { signal: AbortSignal.timeout(25000) });
          if (!response.ok) throw new Error(`Diagnostic HTTP ${response.status}`);
          const data = await response.json();
          const sources = new Set(['standard', 'dream', 'dream_soul']);
          const kinds = new Set(['missing', 'supabase', 'github', 'openrouter', 'anthropic', 'openai', 'groq', 'gemini', 'jwt_token', 'url_not_key', 'unknown']);
          const formats = new Set(['plain', 'empty', 'quoted', 'bearer-prefix']);
          if (!Array.isArray(data.keys)) throw new Error('Invalid diagnostic response');
          const safe = data.keys.map(entry => ({ source: sources.has(entry.source) ? entry.source : 'unknown', kind: kinds.has(entry.kind) ? entry.kind : 'unknown', format: formats.has(entry.format) ? entry.format : 'unknown' }));
          console.log(`::notice title=AI key classification::${JSON.stringify(safe)}`);
          JS
