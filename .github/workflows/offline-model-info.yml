name: Offline model metadata
on:
  push:
    branches: [arena/15a781b8-dream-soul]
    paths: ['.github/workflows/offline-model-info.yml']
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: |
          node --input-type=module <<'JS'
          const data = await (await fetch('https://huggingface.co/api/models/Qwen/Qwen2.5-0.5B-Instruct-GGUF?blobs=true')).json();
          const file = data.siblings?.find(f => /q4_k_m\.gguf$/i.test(f.rfilename));
          if (!file?.lfs?.sha256 || !data.sha) throw new Error('No official Q4_K_M metadata found');
          console.log(`::notice title=Offline model manifest::${JSON.stringify({ repo: data.id, revision: data.sha, filename: file.rfilename, bytes: file.size || file.lfs.size, sha256: file.lfs.sha256, license: data.cardData?.license })}`);
          JS
