name: Android APK

on:
  push:
    branches: [arena/15a781b8-dream-soul]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/android-assets.mjs'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # Preview signing only. A cache is not a production signing-key backup.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dreamsoul-preview-keystore-v1
      - name: Install dependencies and check the app
        run: |
          npm ci
          npm test
          npm run android:sync
      - name: Install the Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build the signed preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PdreamsoulVersionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Verify signature and prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DreamSoul-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/DreamSoul-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/DreamSoul-preview.apk > artifacts/package-info.txt
          sed -n '1,8p' artifacts/package-info.txt
          cd artifacts
          sha256sum DreamSoul-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DreamSoul-Android-APK
          path: |
            artifacts/DreamSoul-preview.apk
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Publish GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-preview-${{ github.run_number }}
        run: |
          cat > artifacts/release-notes.md <<'NOTES'
          ## DreamSoul for Android

          Download **DreamSoul-preview.apk** below and open it on your Android phone (Android 7.0 or newer). Allow installation from your browser or file manager when Android prompts you. Only install APKs from sources you trust.

          - Includes the mobile-first app, character portraits, creator, local demo, chat history, favorites, and safety controls.
          - To explore now: **Sign in → Try a local demo** and complete the 18+ onboarding.
          - Local demo replies are scripted, not generated by a model, and stay on this device.
          - Connected AI requires the owner to set `LLM_API_KEY` in Supabase Edge Function secrets. Google sign-in requires the Google provider to be configured in Supabase.
          - This is a **debug-signed preview** for testing, not a production/Play Store release. Debugging is enabled. Do not use it for sensitive conversations. If a future preview has a different signing key, Android will require uninstalling the old preview first; that removes local demo data. Production releases need a securely managed permanent signing key.

          A SHA-256 checksum is included in `SHA256SUMS.txt`. The APK bundles this release's web assets and loads account/AI services from Supabase over HTTPS. Source and build instructions are in the repository.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/DreamSoul-preview.apk artifacts/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" artifacts/DreamSoul-preview.apk artifacts/SHA256SUMS.txt --target "$GITHUB_SHA" --title "DreamSoul Android Preview #${{ github.run_number }}" --notes-file artifacts/release-notes.md --prerelease
          fi
