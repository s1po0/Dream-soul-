name: Android APK

on:
  push:
    branches: [arena/15a781b8-dream-soul]
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/android-assets.mjs'
      - 'scripts/offline-model.mjs'
      - 'scripts/android-diagnostic.mjs'
      - 'scripts/run-checked.mjs'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish installable APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # Preview signing only. A cache is not a production signing-key backup.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dreamsoul-preview-keystore-v1
      - name: Install dependencies and check the app
        run: |
          npm ci
          npm test
          npm run android:sync
      - name: Install the Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          node scripts/run-checked.mjs "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.3.13750724' 'cmake;3.22.1'
      - name: Build the signed preview APK
        working-directory: android
        run: |
          chmod +x gradlew
          mkdir -p ../.arena
          set -o pipefail
          node ../scripts/run-checked.mjs ./gradlew assembleDebug assembleDebugAndroidTest -PdreamsoulVersionCode=${{ github.run_number }} --no-daemon --max-workers=2 --console=plain 2>&1 | tee ../.arena/android-build.log
      - name: Publish bounded native build diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android-diagnostic.mjs
      - name: Verify and download the official pinned model for testing
        run: node scripts/run-checked.mjs node scripts/offline-model.mjs
      - name: Enable KVM for the real Android offline test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real native download, offline inference, streaming, and cancellation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2 -no-snapshot
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell run-as com.dreamsoul.app mkdir -p files/models
            head -c 4194304 .arena/offline-model.gguf > .arena/model-prefix.part
            adb shell -T 'run-as com.dreamsoul.app sh -c "cat > files/models/dreamsoul-light.part"' < .arena/model-prefix.part
            node scripts/run-checked.mjs android/gradlew -p android connectedDebugAndroidTest -PdreamsoulVersionCode=${{ github.run_number }} -Pandroid.testInstrumentationRunnerArguments.class=com.dreamsoul.app.OfflineEngineTest --no-daemon --console=plain
      - name: Keep native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Native-offline-test-reports
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify signature and prepare download
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DreamSoul-preview.apk
          cp public/offline-model.json artifacts/offline-model.json
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/DreamSoul-preview.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/DreamSoul-preview.apk > artifacts/package-info.txt
          sed -n '1,8p' artifacts/package-info.txt
          cd artifacts
          sha256sum DreamSoul-preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DreamSoul-Android-APK
          path: |
            artifacts/DreamSoul-preview.apk
            artifacts/SHA256SUMS.txt
          retention-days: 14
      - name: Publish GitHub download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: android-preview-${{ github.run_number }}
        run: |
          cat > artifacts/release-notes.md <<'NOTES'
          ## DreamSoul for Android — real Offline AI

          Download **DreamSoul-preview.apk** below and open it on your **64-bit Android phone (Android 7.0 or newer, 4–6 GB RAM recommended)**. Allow installation from your browser or file manager when Android prompts you. Only install APKs from sources you trust.

          - Includes the mobile-first app, character portraits, creator, local demo, chat history, favorites, and safety controls.
          - **Real Offline AI:** open **Offline AI → Download free model** on Wi-Fi (~491 MB), tap **Use Offline AI**, and complete the local 18+ profile. After that, replies work in airplane mode. No API key, cloud account, or API usage fees.
          - Uses Qwen2.5-0.5B Instruct Q4_K_M (Apache 2.0) with llama.cpp (MIT). The separate model is SHA-256 verified, kept in app-private storage, and not bundled in this APK.
          - Local conversations and drafts are separate from the scripted demo. While Offline AI is on, automatic cloud auth, discovery, and chat requests are paused. Return online explicitly from Offline AI settings.
          - Small-model replies can be slow, repetitive, or inaccurate; safety filtering is best-effort. Generation uses battery and may warm the phone. Context: 2,048 tokens; reply cap: 256 tokens. Close other apps if memory is low.
          - Offline chats are device-only, with no DreamSoul backup. Uninstalling or clearing app data removes them. Use the built-in removal controls for local data or model storage.
          - The original **local demo** remains explicitly scripted. Cloud AI still requires an owner-configured provider key **and available provider credit**. Google sign-in requires provider setup.
          - Release is gated on a real Android test: native resumable HTTPS model download + verification, then actual JNI inference, token streaming, memory, and cancellation **with device networking disabled**.
          - This is a **debug-signed preview** for testing, not a production/Play Store release. Debugging is enabled. Do not use it for sensitive conversations. If a future preview has a different signing key, Android will require uninstalling the old preview first; that removes local offline/demo data. Production releases need a securely managed permanent signing key.

          A SHA-256 checksum is included in `SHA256SUMS.txt`. The APK bundles this release's web assets and uses the bundled native engine for Offline AI, and uses Supabase over HTTPS only in online mode. Source and build instructions are in the repository.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/DreamSoul-preview.apk artifacts/SHA256SUMS.txt artifacts/offline-model.json --clobber
          else
            gh release create "$TAG" artifacts/DreamSoul-preview.apk artifacts/SHA256SUMS.txt artifacts/offline-model.json --target "$GITHUB_SHA" --title "DreamSoul Android Preview #${{ github.run_number }}" --notes-file artifacts/release-notes.md --prerelease
          fi
